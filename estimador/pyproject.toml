[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estimador-peso-bovino"
version = "0.1.0"
description = "Estima el peso de un bovino a partir de una foto lateral"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "ultralytics==8.4.144",
    "timm==1.0.29",
]

[project.optional-dependencies]
api = ["fastapi>=0.141.1", "uvicorn[standard]>=0.54.0", "python-multipart>=0.0.32"]

# Solo el módulo; los .pt y api.py no viajan en el paquete (los .pt se bajan con descargar_modelos.py)
[tool.hatch.build.targets.wheel]
only-include = ["estimador.py"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
